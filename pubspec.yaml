name: vku_expense_tracker
description: Quản lý chi tiêu và nhận dạng hóa đơn offline.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: ^0.11.2
  google_mlkit_text_recognition: ^0.15.1
  image_cropper: ^11.0.0
  image_picker: ^1.2.0
  image: ^4.5.4
  isar_community: 3.3.2
  isar_community_flutter_libs: 3.3.2
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.1
  isar_community_generator: 3.3.2
flutter:
  uses-material-design: true
  assets:
    - assets/receipts/
